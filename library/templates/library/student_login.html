{% extends 'library/base.html' %}

{% block title %}Student Login - Smart Library{% endblock %}

{% block content %}

<div class="container">

    <div class="form-card">

        <h2>🎓 Student Login</h2>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Login
            </button>

        </form>

        <br>

        <p>
            Don't have an account?
            <a href="{% url 'student_register' %}">
                Register as Student
            </a>
        </p>

    </div>

</div>

{% endblock %}
