{% extends 'library/base.html' %}

{% block title %}Add Book - Smart Library{% endblock %}

{% block content %}

<div class="container">

    <div class="form-card">

        <h2>📚 Add New Book</h2>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label>Book Title</label>

                <input
                    type="text"
                    name="title"
                    placeholder="Enter book title"
                    required
                >
            </div>

            <div class="form-group">
                <label>Author</label>

                <input
                    type="text"
                    name="author"
                    placeholder="Enter author name"
                    required
                >
            </div>

            <div class="form-group">
                <label>ISBN</label>

                <input
                    type="text"
                    name="isbn"
                    placeholder="Enter ISBN"
                    required
                >
            </div>

            <div class="form-group">
                <label>Quantity</label>

                <input
                    type="number"
                    name="quantity"
                    min="1"
                    placeholder="Enter quantity"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Add Book
            </button>

        </form>

        <br>

        <p>
            <a href="{% url 'librarian_dashboard' %}">
                ← Back to Librarian Dashboard
            </a>
        </p>

    </div>

</div>

{% endblock %}
