{% extends 'library/base.html' %}

{% block title %}Librarian Login - Smart Library{% endblock %}

{% block content %}

<div class="container">

    <div class="form-card">

        <h2>🔐 Librarian Login</h2>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter librarian username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Login
            </button>

        </form>

        <br>

        <p>
            Don't have a librarian account?
            <a href="{% url 'librarian_register' %}">
                Register as Librarian
            </a>
        </p>

    </div>

</div>

{% endblock %}
